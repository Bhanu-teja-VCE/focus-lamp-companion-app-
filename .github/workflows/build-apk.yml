# Builds the Focus Lamp APK in the cloud on every push.
# Download it from the repo's "Releases" section (one release per branch), or from the run's Artifacts.

name: Build APK

on:
  push:
    branches: [main, redesign]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Optional: paste the contents of google-services.json into a repository secret with this
      # name to turn on parent approval (see FAMILY_SETUP.md). Builds work without it.
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Add Firebase config
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build APK
        run: |
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk focus-lamp.apk

      - name: Upload APK to the run
        uses: actions/upload-artifact@v4
        with:
          name: focus-lamp-apk
          path: focus-lamp.apk

      - name: Publish download link (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${GITHUB_REF_NAME}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" focus-lamp.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Focus Lamp: latest ${GITHUB_REF_NAME} build" \
            --notes "Built automatically from commit ${GITHUB_SHA::7}. On your phone, tap focus-lamp.apk below to download and install."
